# Spins up PostgreSQL (database) and Prometheus (metrics collection).
#
# Usage:
#   docker-compose up -d          # start both services
#   docker-compose down           # stop and remove containers

services:
  postgres:
    image: postgres:16-alpine
    container_name: observe-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: observedb
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    extra_hosts:
      - "host.docker.internal:host-gateway"

  prometheus:
    image: prom/prometheus:latest
    container_name: observe-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    # Colima doesn't resolve host.docker.internal automatically.
    extra_hosts:
      - "host.docker.internal:host-gateway"
