# Spins up MSSQL (database) and Prometheus (metrics collection).
#
# Usage:
#   docker-compose up -d          # start both services
#   docker-compose down           # stop and remove containers

services:
  mssql:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: observe-mssql
    ports:
      - "1434:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Test@123456"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  prometheus:
    image: prom/prometheus:latest
    container_name: observe-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    # Colima doesn't resolve host.docker.internal automatically.
    extra_hosts:
      - "host.docker.internal:host-gateway"
