# Prometheus scrape configuration.
#
# Ballerina exposes metrics on port 9797 by default when the Prometheus
# reporter is enabled. "host.docker.internal" lets the Prometheus container
# reach the Ballerina process running on the host machine.
#
# The docker-compose.yml includes an extra_hosts mapping so that
# host.docker.internal resolves correctly (Colima does not set this
# up automatically).

global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "ballerina"
    static_configs:
      - targets: ["host.docker.internal:9797"]
